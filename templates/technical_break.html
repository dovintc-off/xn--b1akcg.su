<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Технические работы</title><style>body{margin:0;padding:0;font-family:sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;justify-content:center;align-items:center;text-align:center}.c{padding:2rem;max-width:500px}h1{font-size:2rem;margin-bottom:1rem;color:#38bdf8}p{font-size:1.1rem;color:#94a3b8;line-height:1.6;margin-bottom:2.5rem}#b{display:none;padding:12px 24px;background:#1e293b;border:1px solid #334155;color:#cbd5e1;border-radius:6px;cursor:pointer;font-size:.9rem;transition:.2s}#b:hover{background:#38bdf8;color:#0f172a}</style></head><body><div class="c"><h1>Сайт на обслуживании</h1><p>Мы проводим технические работы.<br>Скоро всё заработает.</p><button id="b">Продолжить (Админ)</button></div><script>const a={{'true' if session.get('user_id') and check_user_admin_rights(session.get('user_id')) else 'false'}};if(a){const b=document.getElementById('b');b.style.display='inline-block';b.onclick=async()=>{try{const r=await fetch('/api/enable-admin-view',{method:'POST'});if(r.ok)window.location.reload()}catch(e){}}}</script></body></html>
